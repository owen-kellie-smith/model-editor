<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model Editor</title>

  <link rel="stylesheet" href="./styles/main.css">
  <script src="https://cdn.jsdelivr.net/npm/viz.js@2.1.2/viz.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/viz.js@2.1.2/full.render.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
</head>

<body>
  <div class="editor-container">
    <div class="editor">
     <details open>
      <summary>Language</summary>
      <div id="languageLoadedInfo" class="loaded-info">
        <span id="languageLoaded">
        </span>
        <span id="languageDirty" class="dirty">
                </span>
      </div>
      <input type="file" id="loadLanguageFile" accept=".xml">
      <span id="languageExample" class="example-link" style="visibility: hidden;">Example</span>
      <br>
      <textarea id="languageText" cols="80"
        placeholder="Paste language.xml here"></textarea>
      <!-- Validation refers to the editor content -->
      <div id="languageStatus" class="status error">
      </div>
      <br>
      <button id="loadLanguageText">Apply changes</button>
      <button id="downloadLanguage" disabled>Export as XML</button>
     </details>
    </div>

    <div class="editor">
     <details>
      <summary>Model</summary>
      <div id="modelLoadedInfo" class="loaded-info">
        <span id="modelLoaded">
        </span>
        <span id="modelDirty" class="dirty">
        </span>
      </div>
      <input type="file" id="loadModelFile" accept=".xml" disabled>
      <span id="modelExample" class="example-link" style="visibility: hidden;">Example</span>
      <br>
      <textarea id="modelText" cols="80" disabled
        placeholder="Paste model.xml here"></textarea>
      <!-- Validation refers to the editor content -->
      <div id="modelStatus" class="status error">
      </div>
      <br>
      <button id="loadModelText" disabled>Apply changes</button>
      <button id="downloadModel" disabled>Export as XML</button>
      <button id="downloadSpreadsheet" disabled>Export as spreadsheet</button>
      <button id="downloadPython" disabled>Export as Python</button>
     </details>
    </div>

    <div class="editor">
      <details id="spreadsheetPreviewDetails">
        <summary>Sample Evaluation</summary>
        <div id="spreadsheetPreview"></div>
      </details>
    </div>
    <div class="editor">
      <details>
        <summary>Variables</summary>
        <div class="variable-selector">
          <label for="variableDropdown">Select Variable:</label>
          <select id="variableDropdown">
            <option value="">Load a model to see variables...</option>
          </select>
          <label>
            <input type="checkbox" id="sortVariablesAlpha">
            Sort Alphabetically
          </label>
          <button id="newVariableBtn" class="btn-primary">New</button>
        </div>
        <div id="variableDetails" class="variable-details" style="display: none;">
          <div class="variable-info">
            <h4 id="selectedVariableName"></h4>
            <div id="selectedVariableFeatures"></div>
          </div>
          <div class="variable-actions">
            <button id="editVariableBtn" class="btn-secondary">Edit</button>
            <button id="copyVariableBtn" class="btn-secondary">Copy</button>
            <button id="deleteVariableBtn" class="btn-danger">Delete</button>
          </div>
        </div>
        <div id="variableFormSection" class="variable-form-section" style="display: none;">
          <h4 id="variableFormTitle">Edit Variable</h4>
          <div class="variable-form">
            <div class="form-group">
              <label for="editVarDefinition">Variable XML:</label>
              <textarea id="editVarDefinition"></textarea>
            </div>
            <button id="saveVariableBtn" class="btn-primary">Save</button>
            <button id="cancelEditBtn" class="btn-secondary">Cancel</button>
          </div>        
        </div>
      </details>
    </div>
    <div class="editor">
      <details>
        <summary>Graph</summary>
        <div class="graph-controls">
          <label for="graphVariable">Variable:</label>
          <select id="graphVariable" disabled>
            <option value="">Select a variable...</option>
          </select>
          <label>
            <input type="checkbox" id="graphSortAlphabetically">
            Sort Alphabetically
          </label>
          
          <label for="graphDepth">Depth:</label>
          <select id="graphDepth" disabled>
          </select>
          
          <label>
            <input type="checkbox" id="graphFitToScreen" checked>
            Fit to screen
          </label>
          
          <a href="#" id="downloadSvg" class="download-link" style="display: none;">Download SVG</a>
          <a href="#" id="downloadPng" class="download-link" style="display: none;">Download PNG</a>
        </div>
        
        <div class="graph-output">
          <h4>Graph Visualization</h4>
          <div id="graphSvg" class="graph-svg"></div>
        </div>
        
        <div class="graph-output">
          <h4>DOT Source <span id="graphDotCopy" class="example-link" style="visibility: hidden;">Copy</span></h4>
          <pre id="graphDot" class="graph-dot"></pre>
        </div>
      </details>
    </div>

    <div class="editor">
      <details>
        <summary>Report</summary>
        <div id="log"></div>
      </details>
    </div>


  </div>

<br>
<footer>
  <a href="https://github.com/owen-kellie-smith/model-editor/issues" target="_blank">
    Feedback / Report a bug
  </a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script><!-- provides a console for debugging -->
<script type="module" src="./src/app.js"></script>
</body>
</html>
